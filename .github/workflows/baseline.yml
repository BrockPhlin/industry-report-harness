name: Baseline checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
        working-directory: code
      - name: Check package without third-party dependencies
        run: python -S tools/check_package.py
  pv-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.15.1'
      - run: python -m pip install -r code/requirements-midterm.txt
      - run: python -m unittest discover -s tests_midterm -v
        working-directory: code
      - name: Replay numerical claims and source revisions
        run: python tools/evaluate_research_review.py > "$RUNNER_TEMP/report-review.json"
